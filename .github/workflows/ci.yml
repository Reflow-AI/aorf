name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The examples use git LFS for source data. Without this the checker and any
          # published dashboard would silently see pointer files instead.
          lfs: true
          # R18 checks that a hypothesis did not change after an experiment started running,
          # which needs history rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ docs/

      - name: Tests
        run: pytest -q

      - name: aorf check on every example
        # The acceptance criterion from the build plan: the examples must exit 0.
        run: |
          for dir in examples/*/; do
            echo "--- $dir"
            aorf check "$dir" --strict
          done

      - name: check --fix is a no-op on a maintained repo
        # If this fails, a derived value drifted and was committed.
        run: |
          for dir in examples/*/; do
            aorf check "$dir" --fix > /dev/null
          done
          git diff --exit-code -- examples/

      - name: Generated spec artifacts are current
        run: |
          python tests/regen_schema.py
          python tests/regolden.py
          git diff --exit-code -- spec/ tests/golden/
